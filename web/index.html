<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>IntentOS</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <main class="shell" data-ui-root>
      <aside class="sidebar" aria-label="IntentOS navigation">
        <div class="window-controls" aria-hidden="true">
          <span class="control close"></span>
          <span class="control minimize"></span>
          <span class="control zoom"></span>
        </div>

        <div class="brand">
          <p class="eyebrow">Local behavior intelligence</p>
          <h1>IntentOS</h1>
        </div>

        <nav class="nav-list" aria-label="Sections">
          <a class="nav-item active" href="#summary-title">Review</a>
          <a class="nav-item" href="#activity-title">Activity</a>
          <a class="nav-item" href="#timeline-title">Timeline</a>
          <a class="nav-item" href="#youtube-title">YouTube</a>
        </nav>

        <div class="sidebar-status">
          <span class="status-dot" aria-hidden="true"></span>
          <span data-status>Loading local reports</span>
        </div>
      </aside>

      <section class="workspace">
        <header class="toolbar">
          <div>
            <p class="eyebrow">Today</p>
            <h2>Daily Review</h2>
          </div>
          <div class="source-pill" data-activity-source>Fixture replay</div>
        </header>

        <section class="hero" aria-labelledby="summary-title">
          <div class="hero-copy">
            <h2 id="summary-title" data-primary-narrative>Preparing behavior summary</h2>
          </div>
          <dl class="stats" data-stats></dl>
        </section>

        <section class="grid" aria-label="Behavior reports">
          <article class="panel activity-panel">
            <div class="panel-header">
              <div>
                <p class="eyebrow">Breakdown</p>
                <h2 id="activity-title">Activity</h2>
              </div>
            </div>
            <div class="bars" data-activity-bars></div>
          </article>

          <article class="panel timeline-panel">
            <div class="panel-header">
              <div>
                <p class="eyebrow">Replay</p>
                <h2 id="timeline-title">Capture Timeline</h2>
              </div>
              <span class="source-label" data-capture-source>Privacy filtered</span>
            </div>
            <ol class="event-list" data-capture-events></ol>
          </article>

          <article class="panel youtube-panel">
            <div class="panel-header">
              <div>
                <p class="eyebrow">Domain slice</p>
                <h2 id="youtube-title">YouTube</h2>
              </div>
              <span class="source-label">MVP slice</span>
            </div>
            <p class="narrative" data-youtube-narrative>Loading YouTube report</p>
          </article>
        </section>
      </section>
    </main>
    <script src="./app.js" defer></script>
  </body>
</html>
