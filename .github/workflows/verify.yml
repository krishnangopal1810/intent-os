name: Verify

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      INTENTOS_UI_REQUIRE_BROWSER: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run product verification
        run: make verify
